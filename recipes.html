<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Recipes - Digital Recipe Book</title>
    <meta name="description" content="Browse our complete collection of delicious recipes, categorized by Breakfast, Lunch, Dinner, Desserts, Drinks, and Snacks.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External CSS Links -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="styles.css">

    <!-- Embedded Self-Contained Stylesheet for Standalone Use -->
    <style>
        :root {
            --primary-green: #257838;
            --primary-green-hover: #1e622d;
            --primary-orange: #ee5d20;
            --text-dark: #1e252b;
            --text-muted: #5a6578;
            --bg-page: #eaf2eb;
            --card-bg: #ffffff;
            --star-gold: #ffb800;
            --radius-md: 16px;
            --radius-pill: 9999px;
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.06);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background-color: var(--bg-page); color: var(--text-dark); line-height: 1.6; }
        .container { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
        a { text-decoration: none; color: inherit; }

        /* Navigation Bar */
        .navbar { position: sticky; top: 0; background-color: #ffffff; z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05); padding: 14px 0; }
        .nav-container { display: flex; align-items: center; justify-content: space-between; }
        .brand-logo { display: flex; align-items: center; gap: 10px; }
        .logo-text { display: flex; flex-direction: column; font-family: var(--font-heading); font-size: 1.2rem; font-weight: 800; line-height: 1.1; }
        .text-green { color: var(--primary-green); }
        .text-orange { color: var(--primary-orange); }
        .nav-links { display: flex; align-items: center; gap: 32px; }
        .nav-link { font-weight: 600; font-size: 0.95rem; color: var(--text-muted); padding: 6px 0; }
        .nav-link.active { color: var(--primary-orange); font-weight: 700; border-bottom: 3px solid var(--primary-orange); }
        .nav-actions { display: flex; align-items: center; gap: 16px; }
        .icon-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-dark); }

        /* Top Culinary Banner Strip */
        .banner-strip { background-color: #123719; padding: 12px 0; overflow: hidden; border-bottom: 2px solid #165324; }
        .banner-flex { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .banner-item { width: 75px; height: 75px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,0.8); flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .banner-item img { width: 100%; height: 100%; object-fit: cover; }

        /* Page Heading & Filters Bar */
        .catalog-header-section { padding: 30px 0 20px; }
        .page-title { font-family: var(--font-heading); font-size: 2.6rem; font-weight: 800; color: #164a23; margin-bottom: 20px; }

        .toolbar-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
        .select-filter { padding: 10px 18px; border-radius: 12px; border: 1px solid #b0bec5; background-color: #e2e8f0; font-weight: 700; font-family: inherit; font-size: 0.92rem; color: var(--text-dark); cursor: pointer; outline: none; }
        
        .toolbar-search-box { display: flex; align-items: center; background: #dcdfe3; border-radius: var(--radius-pill); padding: 4px 6px 4px 20px; width: 340px; border: 1px solid #cbd5e1; }
        .toolbar-search-box input { border: none; background: transparent; outline: none; width: 100%; font-size: 0.95rem; font-family: inherit; }
        .toolbar-search-box button { background-color: #00a843; color: white; width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Main Catalog Layout (Sidebar + Grid) */
        .catalog-layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; padding-bottom: 60px; }

        /* Left Categories Sidebar */
        .sidebar-categories-box { background: #dbe4dd; border-radius: 18px; border: 1px solid #cbd5e1; overflow: hidden; height: fit-content; }
        .sidebar-header { background-color: var(--primary-green); color: white; padding: 14px; text-align: center; font-family: var(--font-heading); font-weight: 700; font-size: 1.15rem; }
        .sidebar-menu { list-style: none; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .sidebar-item { padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 0.92rem; color: var(--text-dark); cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s ease; }
        .sidebar-item:hover, .sidebar-item.active { background-color: #cbd5e1; color: var(--primary-green); }

        /* Right 4-Column Cards Grid */
        .recipes-4col-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        .recipe-card-alt { background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid #e2e8f0; transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .recipe-card-alt:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); }
        .card-img-wrap { width: 100%; height: 160px; overflow: hidden; }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-content-row { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
        .card-recipe-title { font-family: var(--font-heading); font-size: 1.05rem; font-weight: 700; color: var(--text-dark); }
        .card-meta-line { display: flex; align-items: center; justify-content: space-between; font-size: 0.88rem; font-weight: 700; color: var(--text-dark); }
        .fav-heart-icon { color: #94a3b8; cursor: pointer; font-size: 1rem; }
        .fav-heart-icon:hover, .fav-heart-icon.liked { color: #e53935; }

        /* Footer */
        .footer { background-color: var(--primary-green); color: white; padding: 18px 0; font-size: 0.9rem; }
        /* Modal Overlay & Search Popup */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 99999; display: none; align-items: flex-start; justify-content: center; padding: 70px 20px 30px; }
        .modal-overlay.active { display: flex; }
        .search-modal-container { background: #ffffff; width: 100%; max-width: 680px; border-radius: 20px; box-shadow: 0 25px 60px -15px rgba(0,0,0,0.35); overflow: hidden; display: flex; flex-direction: column; max-height: 80vh; }
        .search-modal-header { display: flex; align-items: center; padding: 18px 24px; border-bottom: 1px solid #f1f5f9; gap: 14px; background: #ffffff; }
        .search-modal-icon { font-size: 1.3rem; color: #00a843; }
        .search-modal-input { flex: 1; border: none; outline: none; font-size: 1.15rem; font-family: inherit; font-weight: 600; color: #1e252b; background: transparent; }
        .search-modal-close-btn { background: #f1f5f9; color: #64748b; border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; }
        .search-modal-close-btn:hover { background: #fee2e2; color: #ef4444; }
        .search-modal-categories { display: flex; gap: 8px; padding: 12px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; overflow-x: auto; white-space: nowrap; }
        .search-tag-chip { padding: 5px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; background: #ffffff; color: #475569; border: 1px solid #cbd5e1; cursor: pointer; }
        .search-tag-chip:hover, .search-tag-chip.active { background: #00a843; color: white; border-color: #00a843; }
        .search-modal-results { padding: 12px 16px; overflow-y: auto; max-height: 480px; display: flex; flex-direction: column; gap: 8px; }
        .search-result-item { display: flex; align-items: center; gap: 16px; padding: 10px 14px; border-radius: 12px; background: #ffffff; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; }
        .search-result-item:hover { background: #f0fdf4; border-color: #bbf7d0; transform: translateX(4px); }
        .search-result-thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
        .search-result-info { flex: 1; min-width: 0; }
        .search-result-title { font-weight: 700; font-size: 1rem; color: #1e252b; margin-bottom: 2px; }
        .search-result-meta { font-size: 0.82rem; color: #64748b; display: flex; align-items: center; gap: 10px; }
        .search-result-badge { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; }
        .search-modal-footer { padding: 10px 24px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; }
        .recipe-detail-modal { background: #ffffff; border-radius: 24px; width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; background: rgba(0,0,0,0.5); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; border: none; }
        .recipe-detail-img { width: 100%; height: 260px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. HEADER NAVIGATION                       -->
    <!-- ========================================== -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <svg viewBox="0 0 40 40" fill="none" width="38" height="38">
                    <path d="M20 5C14.4772 5 10 9.47715 10 15C10 17.5 10.9 19.8 12.4 21.5C9.5 22.8 7.5 25.6 7.5 29H32.5C32.5 25.6 30.5 22.8 27.6 21.5C29.1 19.8 30 17.5 30 15C30 9.47715 25.5228 5 20 5Z" fill="#257838"/>
                    <path d="M8 29H32V32C32 33.6569 30.6569 35 29 35H11C9.34315 35 8 33.6569 8 32V29Z" fill="#EE5D20"/>
                </svg>
                <div class="logo-text">
                    <span class="text-green">Digital</span>
                    <span class="text-orange">Recipe Book</span>
                </div>
            </a>

            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="recipes.html" class="nav-link active">Recipes</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>

            <div class="nav-actions">
                <button class="icon-btn search-trigger-btn" id="searchTriggerBtn" title="Search Recipes (Ctrl+K)"><i class="fa-solid fa-magnifying-glass"></i></button>
                <a href="login.html" class="icon-btn" title="Account"><i class="fa-regular fa-circle-user" style="font-size: 1.4rem;"></i></a>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- 2. CULINARY BANNER STRIP                   -->
    <!-- ========================================== -->
    <div class="banner-strip">
        <div class="container banner-flex">
            <div class="banner-item"><img src="https://images.unsplash.com/photo-1547592166-23ac45744acd?q=80&w=300&auto=format&fit=crop" alt="Tomato Soup"></div>
            <div class="banner-item"><img src="assets/images/fluffy_pancakes.jpg" onerror="this.src='https://images.unsplash.com/photo-1528207776546-365bb710ee93?q=80&w=300';" alt="Pancakes"></div>
            <div class="banner-item"><img src="assets/images/chicken_biryani.jpg" onerror="this.src='https://images.unsplash.com/photo-1563379926898-05f4575a45d8?q=80&w=300';" alt="Biryani"></div>
            <div class="banner-item"><img src="https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?q=80&w=300&auto=format&fit=crop" alt="Grilled Salmon"></div>
            <div class="banner-item"><img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=300&auto=format&fit=crop" alt="Fruit Salad"></div>
            <div class="banner-item"><img src="assets/images/veggie_stir_fry.jpg" onerror="this.src='https://images.unsplash.com/photo-1540420773420-3366772f4999?q=80&w=300';" alt="Stir Fry"></div>
            <div class="banner-item"><img src="assets/images/chocolate_cake.jpg" onerror="this.src='https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=300';" alt="Chocolate Cake"></div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. PAGE TITLE & FILTERS TOOLBAR            -->
    <!-- ========================================== -->
    <div class="container catalog-header-section">
        <h1 class="page-title">All Recipes</h1>

        <!-- Toolbar Filter Controls -->
        <div class="toolbar-row">
            <div style="display: flex; gap: 14px;">
                <select class="select-filter" id="categorySelect">
                    <option value="all">All Categories</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Drinks">Drinks</option>
                    <option value="Snacks">Snacks</option>
                </select>

                <select class="select-filter" id="sortSelect">
                    <option value="newest">Sort By: Newest</option>
                    <option value="rating">Sort By: Top Rated</option>
                    <option value="time">Sort By: Quickest</option>
                </select>
            </div>

            <!-- Toolbar Search Input -->
            <div class="toolbar-search-box">
                <input type="text" id="catalogSearchInput" placeholder="search recipes......">
                <button id="catalogSearchBtn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 4. MAIN LAYOUT (SIDEBAR + RECIPE GRID)    -->
        <!-- ========================================== -->
        <div class="catalog-layout">
            
            <!-- Left Sidebar Categories Menu -->
            <aside class="sidebar-categories-box">
                <div class="sidebar-header">Categories</div>
                <ul class="sidebar-menu">
                    <li class="sidebar-item active" data-cat="all"><span>🎨</span> All Categories</li>
                    <li class="sidebar-item" data-cat="Breakfast"><span>🥐</span> Breakfast</li>
                    <li class="sidebar-item" data-cat="Lunch"><span>🍱</span> Lunch</li>
                    <li class="sidebar-item" data-cat="Dinner"><span>🍲</span> Dinner</li>
                    <li class="sidebar-item" data-cat="Dessert"><span>🍰</span> Dessert</li>
                    <li class="sidebar-item" data-cat="Drinks"><span>🍹</span> Drinks</li>
                    <li class="sidebar-item" data-cat="Snacks"><span>🥗</span> Snacks</li>
                </ul>
            </aside>

            <!-- Right 4-Column Recipe Grid -->
            <main class="recipes-4col-grid" id="catalogGrid">
                <!-- Cards render dynamically via simple JavaScript -->
            </main>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- 5. FOOTER SECTION                         -->
    <!-- ========================================== -->
    <footer class="footer">
        <div class="container footer-flex">
            <div>&copy; 2026 Digital Recipe Book. All rights reserved.</div>
            <div class="social-icons">
                <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </footer>

    <!-- ========================================== -->
    <!-- 6. SIMPLE JAVASCRIPT ENGINE               -->
    <!-- ========================================== -->
    <script>
        // STEP 1: Simple Dataset for the 8 Recipes shown in reference screenshot
        const catalogRecipes = [
            {
                id: 1,
                title: "Fluffy Pancakes",
                category: "Breakfast",
                time: "20 Min",
                rating: 4.6,
                image: "assets/images/fluffy_pancakes.jpg",
                fallback: "https://images.unsplash.com/photo-1528207776546-365bb710ee93?q=80&w=600"
            },
            {
                id: 2,
                title: "Chicken Biriyani",
                category: "Lunch",
                time: "60 Min",
                rating: 4.8,
                image: "assets/images/chicken_biryani.jpg",
                fallback: "https://images.unsplash.com/photo-1563379926898-05f4575a45d8?q=80&w=600"
            },
            {
                id: 3,
                title: "Spaghetti Carbonara",
                category: "Dinner",
                time: "30 Min",
                rating: 4.5,
                image: "assets/images/spaghetti_carbonara.jpg",
                fallback: "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?q=80&w=600"
            },
            {
                id: 4,
                title: "Chocolate Cake",
                category: "Dessert",
                time: "45 Min",
                rating: 4.7,
                image: "assets/images/chocolate_cake.jpg",
                fallback: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=600"
            },
            {
                id: 5,
                title: "Veggie Stir Fry",
                category: "Snacks",
                time: "25 Min",
                rating: 4.4,
                image: "assets/images/veggie_stir_fry.jpg",
                fallback: "https://images.unsplash.com/photo-1540420773420-3366772f4999?q=80&w=600"
            },
            {
                id: 6,
                title: "Tomato Soup",
                category: "Dinner",
                time: "20 Min",
                rating: 4.3,
                image: "https://images.unsplash.com/photo-1547592166-23ac45744acd?q=80&w=600",
                fallback: "https://images.unsplash.com/photo-1547592166-23ac45744acd?q=80&w=600"
            },
            {
                id: 7,
                title: "Grilled Salmon",
                category: "Lunch",
                time: "35 Min",
                rating: 4.6,
                image: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?q=80&w=600",
                fallback: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?q=80&w=600"
            },
            {
                id: 8,
                title: "Fruit Salad",
                category: "Drinks",
                time: "15 Min",
                rating: 4.2,
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=600",
                fallback: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=600"
            }
        ];

        let selectedCategory = 'all';
        let searchQuery = '';

        // STEP 2: Function to Display Recipe Cards in Grid
        function renderCatalog() {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';

            const filtered = catalogRecipes.filter(item => {
                const matchCat = selectedCategory === 'all' || item.category.toLowerCase() === selectedCategory.toLowerCase();
                const matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #777; padding: 40px;">No recipes found in this category.</p>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'recipe-card-alt';
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${item.image}" onerror="this.onerror=null; this.src='${item.fallback}';" alt="${item.title}">
                    </div>
                    <div class="card-content-row">
                        <div class="card-recipe-title">${item.title}</div>
                        <div class="card-meta-line">
                            <span>${item.time} &nbsp;|&nbsp; ⭐ ${item.rating}</span>
                            <i class="fa-regular fa-heart fav-heart-icon" onclick="toggleHeart(this)"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // STEP 3: Favorite Heart Icon Toggle
        function toggleHeart(icon) {
            icon.classList.toggle('fa-regular');
            icon.classList.toggle('fa-solid');
            icon.classList.toggle('liked');
        }

        // STEP 4: Attach Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            const sidebarItems = document.querySelectorAll('.sidebar-item');
            const categorySelect = document.getElementById('categorySelect');
            const searchInput = document.getElementById('catalogSearchInput');
            const searchBtn = document.getElementById('catalogSearchBtn');

            // Sidebar Menu Click Event
            sidebarItems.forEach(item => {
                item.addEventListener('click', () => {
                    sidebarItems.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    selectedCategory = item.getAttribute('data-cat');
                    categorySelect.value = selectedCategory;
                    renderCatalog();
                });
            });

            // Top Dropdown Category Select Event
            categorySelect.addEventListener('change', (e) => {
                selectedCategory = e.target.value;
                sidebarItems.forEach(i => {
                    i.classList.toggle('active', i.getAttribute('data-cat') === selectedCategory);
                });
                renderCatalog();
            });

            // Search Bar Input Event
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderCatalog();
            });

            searchBtn.addEventListener('click', () => {
                searchQuery = searchInput.value;
                renderCatalog();
            });

            // Initial Render
            renderCatalog();
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
