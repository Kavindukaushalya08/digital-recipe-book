<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Details - Digital Recipe Book</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="recipe-details-body">

    <header class="navbar">
        <div class="container nav-container">
            <!-- Logo -->
            <a href="index.html" class="brand-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" width="38" height="38" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 5C14.4772 5 10 9.47715 10 15C10 17.5 10.9 19.8 12.4 21.5C9.5 22.8 7.5 25.6 7.5 29H32.5C32.5 25.6 30.5 22.8 27.6 21.5C29.1 19.8 30 17.5 30 15C30 9.47715 25.5228 5 20 5Z" fill="#257838"/>
                        <path d="M8 29H32V32C32 33.6569 30.6569 35 29 35H11C9.34315 35 8 33.6569 8 32V29Z" fill="#EE5D20"/>
                        <path d="M14 15C14 11.6863 16.6863 9 20 9C23.3137 9 26 11.6863 26 15" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="20" cy="20" r="2" fill="white"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="text-green">Digital</span>
                    <span class="text-orange">Recipe Book</span>
                </div>
            </a>

            <!-- Navigation Links -->
            <nav class="nav-links" id="navLinks">
                <a href="index.html" class="nav-link">Home</a>
                <a href="recipes.html" class="nav-link">Recipes</a>
                <a href="index.html#categories" class="nav-link">Categories</a>
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </nav>

            <!-- User Actions -->
            <div class="nav-actions">
                <button class="search-trigger-btn" id="searchTriggerBtn" title="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <a href="login.html" class="login-btn" id="loginBtn">
                    <i class="fa-regular fa-user"></i>
                    <span>Login</span>
                </a>
            </div>
        </div>
    </header>

    <div class="banner-strip"></div>

    <section class="recipe-details-section container">
        <a href="recipes.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Recipes</a>
        
        <div class="recipe-details-grid" id="recipeDetailsContainer">
            <!-- Content will be injected here by app.js -->
            <div style="text-align: center; padding: 50px; grid-column: 1/-1;">
                <h2>Loading recipe...</h2>
            </div>
        </div>
    </section>

    <footer class="footer" id="contact">
        <div class="container footer-container">
            <div class="copyright-text">
                &copy; 2026 Digital Recipe Book
            </div>
            <div class="social-links">
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
